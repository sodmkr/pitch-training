<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>음감 트레이닝 - 1단계 단음 맞히기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        /* Piano Key Animations & Styles */
        .piano-key {
            transition: all 0.08s ease-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), inset 0 -4px 0 rgba(0, 0, 0, 0.15);
        }
        .piano-key:active, .piano-key.active {
            transform: translateY(4px);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.2), inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* Heart Pulse Effect */
        @keyframes heartPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .heart-damage {
            animation: heartPulse 0.4s ease-in-out;
        }

        /* Glow effects */
        .glow-cyan {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }
        .glow-amber {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-white">

    <!-- Top Header Navigation -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-gradient-to-tr from-cyan-500 to-blue-600 p-2 rounded-xl text-white shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid font-bold fa-music text-lg"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base tracking-tight leading-none text-white">상대음감 마스터</h1>
                    <span class="text-xs font-semibold text-cyan-400">STAGE 1 : C3 ~ C4 단음</span>
                </div>
            </div>

            <!-- Stage Select Button -->
            <button id="btn-open-stages" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs font-bold text-slate-200 transition flex items-center gap-1.5">
                <i class="fa-solid fa-layer-group text-cyan-400"></i>
                <span id="current-stage-title">1-1 단계</span>
                <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-md w-full mx-auto px-4 py-4 flex-1 flex flex-col justify-between gap-4">

        <!-- Info & Progress Card -->
        <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-4 shadow-xl flex flex-col gap-3">
            
            <!-- Question Header Info -->
            <div class="flex items-center justify-between">
                <div>
                    <span id="badge-mode" class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-cyan-950 text-cyan-400 border border-cyan-800/60">
                        연습 모드
                    </span>
                    <h2 id="stage-name-display" class="text-lg font-bold text-slate-100 mt-1">1-1 단계 (도, 레, 미)</h2>
                </div>

                <!-- Lives or Score Counter -->
                <div id="status-container" class="text-right">
                    <!-- Lives for Test Mode (Hidden by default) -->
                    <div id="lives-display" class="hidden flex items-center gap-1 text-red-500 text-lg">
                        <i class="fa-solid fa-heart"></i>
                        <i class="fa-solid fa-heart"></i>
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <!-- Score for Practice Mode -->
                    <div id="score-display" class="text-sm font-semibold text-slate-400">
                        문제 <span id="current-q-num" class="text-cyan-400 font-extrabold text-base">1</span> / <span id="total-q-num">10</span>
                    </div>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-cyan-500 to-blue-500 h-full w-0 transition-all duration-300"></div>
            </div>

            <!-- Hint / Range Indicator -->
            <div class="flex items-center justify-between text-xs text-slate-400 bg-slate-950/50 px-3 py-2 rounded-xl border border-slate-800/50">
                <span><i class="fa-solid fa-circle-info text-cyan-400 mr-1"></i>출제 범위</span>
                <span id="range-text-display" class="font-bold text-slate-300">도(C3), 레(D3), 미(E3)</span>
            </div>
        </div>

        <!-- Audio Sound Player Play Box -->
        <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 flex flex-col items-center justify-center gap-4 relative overflow-hidden shadow-2xl">
            
            <!-- Decorative Glow background -->
            <div class="absolute -top-12 -left-12 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl"></div>

            <!-- Big Sound Play Button -->
            <button id="btn-play-sound" class="w-24 h-24 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white flex flex-col items-center justify-center gap-1 shadow-lg shadow-cyan-500/30 active:scale-95 transition-all duration-150 relative z-10 group">
                <i class="fa-solid fa-volume-high text-3xl group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-bold tracking-wider opacity-90 uppercase">소리 다시듣기</span>
            </button>

            <p id="feedback-text" class="text-xs font-semibold text-slate-400 text-center min-h-[20px]">
                버튼을 누르거나 아래 건반을 눌러 정답을 맞혀보세요!
            </p>
        </div>

        <!-- Interactive Virtual Piano Keys Section -->
        <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-4 shadow-xl">
            <div class="text-xs font-semibold text-slate-400 mb-3 flex items-center justify-between">
                <span><i class="fa-solid fa-keyboard mr-1 text-cyan-400"></i>정답 건반 선택</span>
                <span class="text-[10px] text-slate-500">C3 - C4</span>
            </div>

            <!-- Piano Keyboard Grid Layout -->
            <div id="piano-container" class="grid grid-cols-4 sm:grid-cols-8 gap-2">
                <!-- Piano Keys will be dynamically rendered here -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-3 text-center text-xs text-slate-600 border-t border-slate-900">
        상대음감 훈련 트레이너 v1.0 &copy; Web Audio API
    </footer>

    <!-- Modal: Stage Selector -->
    <div id="modal-stages" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-all duration-200">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-200">
            
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-map text-cyan-400 text-lg"></i>
                    <h3 class="font-bold text-base text-slate-100">소단계 선택</h3>
                </div>
                <button id="btn-close-stages" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- List of Stages -->
            <div class="flex flex-col gap-2.5 max-h-[60vh] overflow-y-auto pr-1" id="stage-list-container">
                <!-- Dynamic Stage Cards -->
            </div>
        </div>
    </div>

    <!-- Modal: Stage Clear / Failed / Test Result -->
    <div id="modal-result" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-200">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-6 shadow-2xl text-center flex flex-col items-center gap-4">
            
            <!-- Result Icon Circle -->
            <div id="result-icon-bg" class="w-20 h-20 rounded-full bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-4xl text-cyan-400 mb-1">
                <i id="result-icon" class="fa-solid fa-trophy"></i>
            </div>

            <div>
                <h3 id="result-title" class="text-xl font-extrabold text-slate-100">단계 완료!</h3>
                <p id="result-desc" class="text-xs text-slate-400 mt-1">10문제 중 8문제를 맞히셨습니다.</p>
            </div>

            <!-- Score Pill -->
            <div class="bg-slate-950 border border-slate-800 px-6 py-3 rounded-xl w-full flex items-center justify-around">
                <div class="text-center">
                    <div class="text-[10px] text-slate-500 uppercase font-bold">최종 점수</div>
                    <div id="result-score-text" class="text-xl font-extrabold text-cyan-400">80점</div>
                </div>
                <div class="w-px h-8 bg-slate-800"></div>
                <div class="text-center">
                    <div class="text-[10px] text-slate-500 uppercase font-bold">통과 여부</div>
                    <div id="result-status-badge" class="text-xs font-bold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800/50 mt-1">
                        통과 (PASS)
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-2 w-full mt-2">
                <button id="btn-result-retry" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-bold text-xs transition">
                    <i class="fa-solid fa-rotate-right mr-1"></i> 다시 시도
                </button>
                <button id="btn-result-next" class="flex-1 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white rounded-xl font-bold text-xs shadow-lg shadow-cyan-500/20 transition">
                    다음 단계로 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Note Frequency Mapping (C3 ~ C4)
        const NOTE_MAP = [
            { id: 'C3', name: '도', solfege: 'C3', freq: 130.81, stage: 1 },
            { id: 'D3', name: '레', solfege: 'D3', freq: 146.83, stage: 1 },
            { id: 'E3', name: '미', solfege: 'E3', freq: 164.81, stage: 1 },
            { id: 'F3', name: '파', solfege: 'F3', freq: 174.61, stage: 2 },
            { id: 'G3', name: '솔', solfege: 'G3', freq: 196.00, stage: 2 },
            { id: 'A3', name: '라', solfege: 'A3', freq: 220.00, stage: 3 },
            { id: 'B3', name: '시', solfege: 'B3', freq: 246.94, stage: 3 },
            { id: 'C4', name: '높은도', solfege: 'C4', freq: 261.63, stage: 4 }
        ];

        // Stage Configuration
        const STAGES = [
            {
                id: '1-1',
                title: '1-1 단계',
                subtitle: '도, 레, 미 (3음)',
                notes: ['C3', 'D3', 'E3'],
                qCount: 10,
                passScore: 7, // 7 out of 10
                type: 'practice'
            },
            {
                id: '1-2',
                title: '1-2 단계',
                subtitle: '도, 레, 미, 파, 솔 (5음)',
                notes: ['C3', 'D3', 'E3', 'F3', 'G3'],
                qCount: 10,
                passScore: 7,
                type: 'practice'
            },
            {
                id: '1-3',
                title: '1-3 단계',
                subtitle: '도 ~ 시 (7음 전체)',
                notes: ['C3', 'D3', 'E3', 'F3', 'G3', 'A3', 'B3'],
                qCount: 10,
                passScore: 7,
                type: 'practice'
            },
            {
                id: '1-4',
                title: '1-4 단계',
                subtitle: '도 ~ 높은도 (1옥타브 완성)',
                notes: ['C3', 'D3', 'E3', 'F3', 'G3', 'A3', 'B3', 'C4'],
                qCount: 10,
                passScore: 7,
                type: 'practice'
            },
            {
                id: 'test',
                title: '🏆 1단계 최종 승급 시험',
                subtitle: 'C3~C4 전체 음 무작위 (목숨 3개)',
                notes: ['C3', 'D3', 'E3', 'F3', 'G3', 'A3', 'B3', 'C4'],
                qCount: 15,
                passScore: 12, // 12/15
                type: 'test'
            }
        ];

        // Web Audio Context
        let audioCtx = null;

        // App State
        let state = {
            currentStageIdx: 0,
            unlockedStageIdx: 0, // Saved in localStorage
            currentQuestionIdx: 0,
            correctCount: 0,
            lives: 3,
            currentNote: null,
            isAnsweringAllowed: true,
            stageHistory: []
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadProgress();
            initUI();
            setupEventListeners();
            loadStage(state.currentStageIdx);
        });

        // Load unlocked stage from localStorage
        function loadProgress() {
            const saved = localStorage.getItem('pitch_trainer_stage');
            if (saved !== null) {
                state.unlockedStageIdx = parseInt(saved, 10);
            }
        }

        // Save progress to localStorage
        function saveProgress() {
            localStorage.setItem('pitch_trainer_stage', state.unlockedStageIdx);
        }

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Synthesize realistic piano note using sine + triangle waves & exponential decay
        function playNoteSound(freq, duration = 1.2) {
            initAudio();

            const now = audioCtx.currentTime;

            // Main Oscillator (Fundamental frequency - Sine)
            const osc1 = audioCtx.createOscillator();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(freq, now);

            // Sub Harmonic Oscillator (Triangle for brightness)
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(freq, now);

            // Gain envelope for ADSR
            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.6, now + 0.02); // Attack
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration); // Decay / Release

            // Connect nodes
            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + duration);
            osc2.stop(now + duration);
        }

        function initUI() {
            renderPianoKeys();
            renderStageListModal();
        }

        // Render piano key buttons
        function renderPianoKeys() {
            const container = document.getElementById('piano-container');
            container.innerHTML = '';

            NOTE_MAP.forEach((note) => {
                const button = document.createElement('button');
                button.id = `key-${note.id}`;
                button.dataset.noteId = note.id;
                button.className = `piano-key bg-slate-800 hover:bg-slate-700 active:bg-cyan-600 border border-slate-700/80 rounded-xl p-3 flex flex-col items-center justify-between gap-2 text-slate-200 transition font-bold disabled:opacity-40 disabled:cursor-not-allowed`;

                button.innerHTML = `
                    <span class="text-xs text-slate-400">${note.solfege}</span>
                    <span class="text-lg text-white font-extrabold">${note.name}</span>
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-600 indicator"></div>
                `;

                button.addEventListener('click', () => handleNoteGuess(note));
                container.appendChild(button);
            });
        }

        // Render Stage Selector List inside Modal
        function renderStageListModal() {
            const container = document.getElementById('stage-list-container');
            container.innerHTML = '';

            STAGES.forEach((stage, idx) => {
                const isUnlocked = idx <= state.unlockedStageIdx;
                const isCurrent = idx === state.currentStageIdx;

                const card = document.createElement('div');
                card.className = `p-3.5 rounded-xl border flex items-center justify-between cursor-pointer transition ${
                    isCurrent 
                        ? 'bg-cyan-950/60 border-cyan-500/80 text-white shadow-lg shadow-cyan-500/10' 
                        : isUnlocked 
                            ? 'bg-slate-800/80 border-slate-700 text-slate-200 hover:bg-slate-750' 
                            : 'bg-slate-950 border-slate-850 text-slate-600 cursor-not-allowed'
                }`;

                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-lg ${isUnlocked ? (stage.type === 'test' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30') : 'bg-slate-900 text-slate-600'} flex items-center justify-center font-bold text-sm">
                            ${isUnlocked ? (stage.type === 'test' ? '<i class="fa-solid fa-trophy"></i>' : idx + 1) : '<i class="fa-solid fa-lock"></i>'}
                        </div>
                        <div>
                            <div class="font-bold text-sm text-slate-100 flex items-center gap-1.5">
                                ${stage.title}
                                ${isCurrent ? '<span class="text-[10px] bg-cyan-500 text-slate-950 font-extrabold px-1.5 py-0.2 rounded">현재</span>' : ''}
                            </div>
                            <div class="text-xs text-slate-400">${stage.subtitle}</div>
                        </div>
                    </div>
                    <div>
                        ${isUnlocked ? '<i class="fa-solid fa-chevron-right text-slate-500 text-xs"></i>' : '<i class="fa-solid fa-lock text-slate-600 text-xs"></i>'}
                    </div>
                `;

                if (isUnlocked) {
                    card.addEventListener('click', () => {
                        loadStage(idx);
                        closeStageModal();
                    });
                }

                container.appendChild(card);
            });
        }

        function setupEventListeners() {
            // Stage Modal Controls
            document.getElementById('btn-open-stages').addEventListener('click', openStageModal);
            document.getElementById('btn-close-stages').addEventListener('click', closeStageModal);

            // Sound Play Button
            document.getElementById('btn-play-sound').addEventListener('click', () => {
                if (state.currentNote) {
                    playNoteSound(state.currentNote.freq);
                }
            });

            // Result Modal Buttons
            document.getElementById('btn-result-retry').addEventListener('click', () => {
                closeResultModal();
                loadStage(state.currentStageIdx);
            });

            document.getElementById('btn-result-next').addEventListener('click', () => {
                closeResultModal();
                if (state.currentStageIdx < STAGES.length - 1) {
                    loadStage(state.currentStageIdx + 1);
                } else {
                    loadStage(0); // Loop back
                }
            });
        }

        function loadStage(stageIdx) {
            state.currentStageIdx = stageIdx;
            state.currentQuestionIdx = 0;
            state.correctCount = 0;
            state.lives = 3;
            state.isAnsweringAllowed = true;

            const stage = STAGES[stageIdx];

            // Update Header & Labels
            document.getElementById('current-stage-title').innerText = stage.title.replace('🏆 ', '');
            document.getElementById('stage-name-display').innerText = stage.title;
            document.getElementById('range-text-display').innerText = stage.subtitle;

            // UI Mode adjustment (Practice vs Test)
            const badgeMode = document.getElementById('badge-mode');
            const livesDisplay = document.getElementById('lives-display');
            const scoreDisplay = document.getElementById('score-display');

            if (stage.type === 'test') {
                badgeMode.innerText = '승급 시험';
                badgeMode.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-950 text-amber-400 border border-amber-800/60';
                livesDisplay.classList.remove('hidden');
                scoreDisplay.classList.add('hidden');
                updateLivesUI();
            } else {
                badgeMode.innerText = '연습 모드';
                badgeMode.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-cyan-950 text-cyan-400 border border-cyan-800/60';
                livesDisplay.classList.add('hidden');
                scoreDisplay.classList.remove('hidden');
            }

            document.getElementById('total-q-num').innerText = stage.qCount;
            updateProgressBar();
            updatePianoKeysAvailability(stage);
            renderStageListModal();

            // Generate First Question
            nextQuestion();
        }

        // Enable only available piano keys for the current stage
        function updatePianoKeysAvailability(stage) {
            NOTE_MAP.forEach((note) => {
                const keyBtn = document.getElementById(`key-${note.id}`);
                const isAvailable = stage.notes.includes(note.id);
                keyBtn.disabled = !isAvailable;

                if (isAvailable) {
                    keyBtn.classList.remove('opacity-30', 'border-dashed');
                } else {
                    keyBtn.classList.add('opacity-30', 'border-dashed');
                }
            });
        }

        // Pick next random note from allowed pool
        function nextQuestion() {
            const stage = STAGES[state.currentStageIdx];

            if (state.currentQuestionIdx >= stage.qCount) {
                finishStage();
                return;
            }

            state.currentQuestionIdx++;
            document.getElementById('current-q-num').innerText = state.currentQuestionIdx;
            updateProgressBar();

            // Pick random note ID from current stage's note pool
            const allowedNoteIds = stage.notes;
            const randomNoteId = allowedNoteIds[Math.floor(Math.random() * allowedNoteIds.length)];
            state.currentNote = NOTE_MAP.find(n => n.id === randomNoteId);

            state.isAnsweringAllowed = true;
            document.getElementById('feedback-text').innerText = '소리를 잘 듣고 건반을 눌러주세요.';
            document.getElementById('feedback-text').className = 'text-xs font-semibold text-slate-400 text-center min-h-[20px]';

            // Play the question note automatically after short delay
            setTimeout(() => {
                if (state.currentNote) {
                    playNoteSound(state.currentNote.freq);
                }
            }, 300);
        }

        function handleNoteGuess(guessedNote) {
            if (!state.isAnsweringAllowed || !state.currentNote) return;

            initAudio();
            playNoteSound(guessedNote.freq); // Play note on press

            const stage = STAGES[state.currentStageIdx];
            const isCorrect = guessedNote.id === state.currentNote.id;
            const feedbackText = document.getElementById('feedback-text');
            const keyBtn = document.getElementById(`key-${guessedNote.id}`);

            state.isAnsweringAllowed = false;

            if (isCorrect) {
                // Correct Answer
                state.correctCount++;
                feedbackText.innerText = `⭕ 정답입니다! (${state.currentNote.name})`;
                feedbackText.className = 'text-xs font-bold text-emerald-400 text-center min-h-[20px]';

                // Visual Key Glow Animation
                keyBtn.classList.add('bg-emerald-600/80', 'border-emerald-400');
                setTimeout(() => {
                    keyBtn.classList.remove('bg-emerald-600/80', 'border-emerald-400');
                    nextQuestion();
                }, 900);

            } else {
                // Wrong Answer
                feedbackText.innerText = `❌ 오답! 정답은 [${state.currentNote.name}] 이었습니다.`;
                feedbackText.className = 'text-xs font-bold text-rose-400 text-center min-h-[20px]';

                keyBtn.classList.add('bg-rose-600/80', 'border-rose-400');
                
                // Highlight actual correct key
                const correctKeyBtn = document.getElementById(`key-${state.currentNote.id}`);
                correctKeyBtn.classList.add('bg-emerald-600/80', 'border-emerald-400');

                // Handle Life Loss in Test Mode
                if (stage.type === 'test') {
                    state.lives--;
                    updateLivesUI();

                    if (state.lives <= 0) {
                        setTimeout(() => {
                            keyBtn.classList.remove('bg-rose-600/80', 'border-rose-400');
                            correctKeyBtn.classList.remove('bg-emerald-600/80', 'border-emerald-400');
                            showTestFailedModal();
                        }, 1000);
                        return;
                    }
                }

                setTimeout(() => {
                    keyBtn.classList.remove('bg-rose-600/80', 'border-rose-400');
                    correctKeyBtn.classList.remove('bg-emerald-600/80', 'border-emerald-400');
                    nextQuestion();
                }, 1200);
            }
        }

        function updateProgressBar() {
            const stage = STAGES[state.currentStageIdx];
            const percent = ((state.currentQuestionIdx - 1) / stage.qCount) * 100;
            document.getElementById('progress-bar').style.width = `${Math.max(0, percent)}%`;
        }

        function updateLivesUI() {
            const livesDisplay = document.getElementById('lives-display');
            livesDisplay.innerHTML = '';

            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('i');
                if (i < state.lives) {
                    heart.className = 'fa-solid fa-heart text-rose-500 heart-damage';
                } else {
                    heart.className = 'fa-regular fa-heart text-slate-700';
                }
                livesDisplay.appendChild(heart);
            }
        }

        function finishStage() {
            const stage = STAGES[state.currentStageIdx];
            const isPassed = state.correctCount >= stage.passScore;

            // Save Progress if passed
            if (isPassed && state.currentStageIdx >= state.unlockedStageIdx) {
                state.unlockedStageIdx = Math.min(state.currentStageIdx + 1, STAGES.length - 1);
                saveProgress();
                renderStageListModal();
            }

            showResultModal(isPassed);
        }

        function showTestFailedModal() {
            const modal = document.getElementById('modal-result');
            const iconBg = document.getElementById('result-icon-bg');
            const icon = document.getElementById('result-icon');
            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            const scoreText = document.getElementById('result-score-text');
            const statusBadge = document.getElementById('result-status-badge');
            const nextBtn = document.getElementById('btn-result-next');

            iconBg.className = 'w-20 h-20 rounded-full bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-4xl text-rose-400 mb-1';
            icon.className = 'fa-solid fa-heart-crack';
            title.innerText = '승급 시험 실패!';
            desc.innerText = '목숨 3개를 모두 소모하였습니다. 다시 도전해 보세요!';
            scoreText.innerText = `${state.correctCount} / 15`;
            
            statusBadge.innerText = '불합격 (FAIL)';
            statusBadge.className = 'text-xs font-bold px-2 py-0.5 rounded bg-rose-950 text-rose-400 border border-rose-800/50 mt-1';

            nextBtn.classList.add('hidden'); // Cannot go next on fail

            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function showResultModal(isPassed) {
            const stage = STAGES[state.currentStageIdx];
            const modal = document.getElementById('modal-result');
            const iconBg = document.getElementById('result-icon-bg');
            const icon = document.getElementById('result-icon');
            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            const scoreText = document.getElementById('result-score-text');
            const statusBadge = document.getElementById('result-status-badge');
            const nextBtn = document.getElementById('btn-result-next');

            const scorePercent = Math.round((state.correctCount / stage.qCount) * 100);
            scoreText.innerText = `${scorePercent}점`;

            if (isPassed) {
                iconBg.className = 'w-20 h-20 rounded-full bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-4xl text-emerald-400 mb-1';
                icon.className = stage.type === 'test' ? 'fa-solid fa-award' : 'fa-solid fa-trophy';
                title.innerText = stage.type === 'test' ? '🎉 1단계 최종 합격!' : '단계 통과!';
                desc.innerText = `${stage.qCount}문제 중 ${state.correctCount}문제를 맞히셨습니다.`;
                
                statusBadge.innerText = '통과 (PASS)';
                statusBadge.className = 'text-xs font-bold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800/50 mt-1';

                nextBtn.classList.remove('hidden');
                if (state.currentStageIdx >= STAGES.length - 1) {
                    nextBtn.innerText = '처음 단계로';
                } else {
                    nextBtn.innerText = '다음 단계로';
                }
            } else {
                iconBg.className = 'w-20 h-20 rounded-full bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-4xl text-amber-400 mb-1';
                icon.className = 'fa-solid fa-rotate-left';
                title.innerText = '아쉬워요!';
                desc.innerText = `통과 기준은 ${stage.passScore}문제 이상 정답입니다.`;
                
                statusBadge.innerText = '미통과 (RETRY)';
                statusBadge.className = 'text-xs font-bold px-2 py-0.5 rounded bg-amber-950 text-amber-400 border border-amber-800/50 mt-1';

                nextBtn.classList.add('hidden');
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeResultModal() {
            const modal = document.getElementById('modal-result');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function openStageModal() {
            const modal = document.getElementById('modal-stages');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.remove('translate-y-full');
        }

        function closeStageModal() {
            const modal = document.getElementById('modal-stages');
            modal.querySelector('div').classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('opacity-0', 'pointer-events-none');
            }, 150);
        }
    </script>
</body>
</html>
