<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>너도 할 수 있어 절대음감</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Do+Hyeon&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #F9E8D2;
      font-family: 'Jua', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      max-height: 900px;
      background-color: #F9E8D2;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ================= 1. 인트로 화면 ================= */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    #intro-screen {
      background-color: #F9E8D2;
      position: relative;
      overflow: hidden;
    }

    /* 좌측 피아노 건반 배경 */
    .piano-bg {
      position: absolute;
      left: 0;
      top: 0;
      width: 32%;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #333;
      z-index: 1;
    }

    .white-key-bg {
      flex: 1;
      background: #f0f0f0;
      border-bottom: 2px solid #a0a0a0;
      border-radius: 0 8px 8px 0;
      box-shadow: inset -3px -3px 5px rgba(0,0,0,0.15);
      position: relative;
    }

    .black-key-bg {
      position: absolute;
      right: -2px;
      width: 60%;
      height: 7%;
      background: #1a1a1a;
      border-radius: 0 4px 4px 0;
      z-index: 2;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
    }

    /* 인트로 타이틀 & PLAY 버튼 컨테이너 */
    .intro-content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 60px 20px;
    }

    /* 글리치 느낌 3D 타이틀 */
    .title-box {
      margin-top: 40px;
      text-align: center;
      line-height: 1.15;
    }

    .title-line {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 3.2rem;
      font-weight: 900;
      color: #9d00ff;
      text-shadow: 
        -3px -3px 0 #00ffff,
         3px -3px 0 #00ffff,
        -3px  3px 0 #00ffff,
         3px  3px 0 #00ffff,
         5px  5px 0 #6b00b3;
      letter-spacing: 2px;
    }

    /* PLAY NOW 버튼 */
    .play-btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      margin-bottom: 40px;
      transition: transform 0.1s ease;
    }

    .play-btn-wrapper:active {
      transform: scale(0.92);
    }

    .play-triangle-btn {
      width: 0;
      height: 0;
      border-top: 50px solid transparent;
      border-bottom: 50px solid transparent;
      border-left: 90px solid #FFCC00;
      position: relative;
      filter: drop-shadow(4px 4px 0px #8B0020) drop-shadow(-2px -2px 0px #A00000);
    }

    .play-text {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 2rem;
      color: #333;
      margin-top: 15px;
      text-shadow: 
        -1px -1px 0 #FFD700, 
         1px -1px 0 #FFD700, 
        -1px  1px 0 #FFD700, 
         1px  1px 0 #FFD700;
      letter-spacing: 1px;
    }

    /* ================= 2. 스테이지 선택 화면 ================= */
    .header {
      padding: 20px;
      text-align: center;
      background: #f2dec4;
      border-bottom: 2px solid #e0c8aa;
    }

    .header h2 {
      font-size: 1.8rem;
      color: #4a3b32;
    }

    .stage-list {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
    }

    .stage-card {
      background: #fff;
      padding: 18px 20px;
      border-radius: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.06);
      border: 2px solid #ebd2b7;
      cursor: pointer;
      transition: all 0.2s;
    }

    .stage-card.locked {
      background: #ebe0d3;
      opacity: 0.6;
      cursor: not-allowed;
    }

    .stage-card.exam {
      background: #fff5e6;
      border-color: #ffaa00;
    }

    .stage-info h3 {
      font-size: 1.3rem;
      color: #333;
      margin-bottom: 4px;
    }

    .stage-info p {
      font-size: 0.95rem;
      color: #666;
    }

    .stage-status {
      font-size: 1.2rem;
      font-weight: bold;
    }

    /* ================= 3. 플레이 / 시험 화면 ================= */
    #play-screen {
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-btn {
      background: #e6cbac;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'Jua';
      font-size: 1rem;
      cursor: pointer;
      color: #4a3b32;
    }

    .progress-info {
      font-size: 1.2rem;
      color: #4a3b32;
    }

    .life-box {
      font-size: 1.3rem;
    }

    .quiz-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .listen-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #ffaa00;
      border: none;
      box-shadow: 0 6px 0 #cc8800, 0 10px 10px rgba(0,0,0,0.15);
      color: white;
      font-size: 2.5rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.1s;
    }

    .listen-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #cc8800;
    }

    .hint-text {
      font-size: 1.1rem;
      color: #666;
    }

    /* 피아노 건반 인터페이스 */
    .piano-keyboard {
      display: flex;
      height: 180px;
      width: 100%;
      background: #222;
      padding: 5px;
      border-radius: 12px;
      position: relative;
    }

    .key {
      flex: 1;
      background: white;
      border: 1px solid #ccc;
      border-radius: 0 0 6px 6px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
      font-weight: bold;
      font-size: 1.1rem;
      color: #333;
      cursor: pointer;
      position: relative;
      z-index: 1;
    }

    .key:active, .key.active {
      background: #e0e0e0;
      padding-bottom: 8px;
    }

    .key.black {
      background: #333;
      color: white;
      height: 60%;
      width: 10%;
      position: absolute;
      z-index: 2;
      border-radius: 0 0 4px 4px;
    }

    .key.black:active, .key.black.active {
      background: #555;
    }
  </style>
</head>
<body>

<div id="app-container">
  
  <!-- 1. 인트로 화면 -->
  <div id="intro-screen" class="screen active">
    <!-- 좌측 세로 건반 배경 -->
    <div class="piano-bg">
      <div class="white-key-bg"><div class="black-key-bg" style="top: 70%;"></div></div>
      <div class="white-key-bg"></div>
      <div class="white-key-bg"><div class="black-key-bg" style="top: 70%;"></div></div>
      <div class="white-key-bg"><div class="black-key-bg" style="top: 70%;"></div></div>
      <div class="white-key-bg"></div>
      <div class="white-key-bg"><div class="black-key-bg" style="top: 70%;"></div></div>
      <div class="white-key-bg"></div>
    </div>

    <!-- 타이틀 & 시작 버튼 -->
    <div class="intro-content">
      <div class="title-box">
        <div class="title-line">너도 할</div>
        <div class="title-line">수 있어</div>
        <div class="title-line">절대음감</div>
      </div>

      <div class="play-btn-wrapper" onclick="goToStageSelect()">
        <div class="play-triangle-btn"></div>
        <div class="play-text">PLAY NOW</div>
      </div>
    </div>
  </div>

  <!-- 2. 스테이지 선택 화면 -->
  <div id="stage-screen" class="screen">
    <div class="header">
      <h2>1단계: C3~C4 단음 맞히기</h2>
    </div>
    <div class="stage-list" id="stage-list-box">
      <!-- 자바스크립트로 동적 생성 -->
    </div>
  </div>

  <!-- 3. 플레이 / 시험 화면 -->
  <div id="play-screen" class="screen">
    <div class="top-bar">
      <button class="back-btn" onclick="goToStageSelect()">← 목록</button>
      <div class="progress-info" id="progress-text">1 / 10</div>
      <div class="life-box" id="life-box"></div>
    </div>

    <div class="quiz-area">
      <p class="hint-text" id="hint-text">소리를 듣고 아래 건반을 누르세요!</p>
      <button class="listen-btn" onclick="playCurrentNote()">🔊</button>
    </div>

    <div class="piano-keyboard" id="keyboard">
      <!-- 자바스크립트로 건반 생성 -->
    </div>
  </div>

</div>

<script>
  // ================= 音 & 스테이지 데이터 =================
  const NOTES = {
    'C3': { name: '도', freq: 130.81 },
    'D3': { name: '레', freq: 146.83 },
    'E3': { name: '미', freq: 164.81 },
    'F3': { name: '파', freq: 174.61 },
    'G3': { name: '솔', freq: 196.00 },
    'A3': { name: '라', freq: 220.00 },
    'B3': { name: '시', freq: 246.94 },
    'C4': { name: '높은도', freq: 261.63 }
  };

  const STAGES = [
    { id: '1-1', title: '1-1 단계', desc: '도, 레, 미 (3개 음)', notes: ['C3','D3','E3'], total: 10 },
    { id: '1-2', title: '1-2 단계', desc: '도, 레, 미, 파, 솔 (5개 음)', notes: ['C3','D3','E3','F3','G3'], total: 10 },
    { id: '1-3', title: '1-3 단계', desc: '도 ~ 시 (7개 음)', notes: ['C3','D3','E3','F3','G3','A3','B3'], total: 10 },
    { id: '1-4', title: '1-4 단계', desc: 'C3 ~ C4 (8개 음 전체)', notes: ['C3','D3','E3','F3','G3','A3','B3','C4'], total: 10 },
    { id: 'exam', title: '👑 1단계 승급 시험', desc: '15문제 / 목숨 3개', notes: ['C3','D3','E3','F3','G3','A3','B3','C4'], total: 15, isExam: true }
  ];

  // 상태 변수
  let unlockedStages = JSON.parse(localStorage.getItem('unlockedStages')) || ['1-1'];
  let currentStage = null;
  let currentQuestionIndex = 0;
  let currentTargetNote = null;
  let lives = 3;
  let score = 0;

  // Web Audio API
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playSound(freq) {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 1.2);
  }

  // 화면 전환
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function goToStageSelect() {
    renderStageList();
    showScreen('stage-screen');
  }

  // 스테이지 목록 그리기
  function renderStageList() {
    const listContainer = document.getElementById('stage-list-box');
    listContainer.innerHTML = '';

    STAGES.forEach(stage => {
      const isUnlocked = unlockedStages.includes(stage.id);
      const card = document.createElement('div');
      card.className = `stage-card ${!isUnlocked ? 'locked' : ''} ${stage.isExam ? 'exam' : ''}`;
      
      card.innerHTML = `
        <div class="stage-info">
          <h3>${stage.title}</h3>
          <p>${stage.desc}</p>
        </div>
        <div class="stage-status">${isUnlocked ? '▶' : '🔒'}</div>
      `;

      if (isUnlocked) {
        card.onclick = () => startStage(stage);
      }

      listContainer.appendChild(card);
    });
  }

  // 게임 시작
  function startStage(stage) {
    currentStage = stage;
    currentQuestionIndex = 0;
    score = 0;
    lives = stage.isExam ? 3 : 0;

    renderKeyboard(stage.notes);
    showScreen('play-screen');
    nextQuestion();
  }

  // 건반 생성
  function renderKeyboard(availableNotes) {
    const keyboard = document.getElementById('keyboard');
    keyboard.innerHTML = '';

    availableNotes.forEach(noteKey => {
      const keyData = NOTES[noteKey];
      const btn = document.createElement('div');
      btn.className = 'key';
      btn.innerText = keyData.name;
      btn.onclick = () => checkAnswer(noteKey);
      keyboard.appendChild(btn);
    });
  }

  // 다음 문제
  function nextQuestion() {
    if (currentQuestionIndex >= currentStage.total) {
      // 스테이지 성공 처리
      alert(`${currentStage.title} 통과! 🎉`);
      unlockNextStage();
      goToStageSelect();
      return;
    }

    currentQuestionIndex++;
    document.getElementById('progress-text').innerText = `${currentQuestionIndex} / ${currentStage.total}`;
    
    if (currentStage.isExam) {
      document.getElementById('life-box').innerText = '❤️'.repeat(lives);
    } else {
      document.getElementById('life-box').innerText = '';
    }

    // 무작위 음 선택
    const available = currentStage.notes;
    currentTargetNote = available[Math.floor(Math.random() * available.length)];

    setTimeout(() => {
      playCurrentNote();
    }, 300);
  }

  function playCurrentNote() {
    if (currentTargetNote) {
      playSound(NOTES[currentTargetNote].freq);
    }
  }

  // 정답 체크
  function checkAnswer(selectedNote) {
    playSound(NOTES[selectedNote].freq);

    if (selectedNote === currentTargetNote) {
      score++;
      nextQuestion();
    } else {
      if (currentStage.isExam) {
        lives--;
        if (lives <= 0) {
          alert('승급 시험 실패! 처음부터 다시 도전하세요! 💔');
          goToStageSelect();
          return;
        }
        document.getElementById('life-box').innerText = '❤️'.repeat(lives);
        alert(`틀렸습니다! (남은 목숨: ${lives})`);
      } else {
        alert(`아쉽네요! 정답은 [${NOTES[currentTargetNote].name}] 이었습니다.`);
        nextQuestion();
      }
    }
  }

  // 다음 스테이지 해금
  function unlockNextStage() {
    const currentIndex = STAGES.findIndex(s => s.id === currentStage.id);
    if (currentIndex < STAGES.length - 1) {
      const nextId = STAGES[currentIndex + 1].id;
      if (!unlockedStages.includes(nextId)) {
        unlockedStages.push(nextId);
        localStorage.setItem('unlockedStages', JSON.stringify(unlockedStages));
      }
    }
  }
</script>

</body>
</html>
